# AI Factory: convierte issues etiquetados en cambios probados y revisados.
# https://github.com/miguelortega1518/ai-factory
#
# Requisitos (Settings → Secrets and variables → Actions):
#   - CLAUDE_CODE_OAUTH_TOKEN (obligatorio): token de tu suscripción de Claude. Genéralo en tu equipo
#     con `claude setup-token`. Las ejecuciones consumen la cuota de la suscripción, no API de pago.
#   - FORJA_EMAIL y FORJA_PASSWORD (opcional): cuenta de la fábrica en Forja, para registrar su trabajo.
#   - FACTORY_GH_TOKEN  (recomendado): token personal con permiso de escritura en Contents, Pull requests e Issues.
#     Sin él, los push y PR de la fábrica usan GITHUB_TOKEN y GitHub NO lanza el CI sobre ellos.
# Y en Settings → Actions → General: "Allow GitHub Actions to create and approve pull requests".
name: AI Factory

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      task:
        description: "Tarea en texto libre"
        required: false
      issue:
        description: "Número de issue (lo usa el reintento automático tras el límite de uso)"
        required: false

      resume_run_id:
        description: "Ejecución a recuperar (requiere issue y checkpoint_artifact)"
        required: false
      checkpoint_artifact:
        description: "ID del artefacto de recuperación"
        required: false

permissions:
  actions: read  # validar y descargar puntos de recuperación
  contents: write
  pull-requests: write
  issues: write   # la fábrica comenta el resultado y cierra el issue

# Una ejecución por issue: varias tareas avanzan en paralelo sin cancelarse entre sí (con un grupo
# único, GitHub sólo deja una en espera y cancelaba las demás). Si dos fusionan a la vez, la fábrica
# incorpora la otra, vuelve a verificar y reintenta la fusión.
concurrency:
  group: ai-factory-${{ github.event.issue.number || github.event.inputs.issue || github.run_id }}
  cancel-in-progress: false

jobs:
  factory:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'ai-factory'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    # Base de datos desechable para el tester funcional (misma versión que producción, como el CI).
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sgf
          POSTGRES_PASSWORD: sgf
          POSTGRES_DB: sgf_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sgf -d sgf_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ secrets.FACTORY_GH_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar AI Factory y Claude Code
        run: |
          pip install "ai-factory @ git+https://github.com/miguelortega1518/ai-factory@804167d0a7be6e7502f0ccd995ecc8d9c7561fb9"
          # Instalador nativo: trae siempre la última versión (los modelos nuevos exigen versiones recientes).
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/claude" --version

      - name: Instalar el navegador del tester funcional
        run: |
          npm install -g playwright@1.63.0
          npx -y playwright@1.63.0 install --with-deps chromium
          command -v psql || sudo apt-get install -y postgresql-client
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"

      - name: Configurar git
        run: |
          git config user.name "ai-factory[bot]"
          git config user.email "ai-factory@users.noreply.github.com"

      - name: Instalar transporte de checkpoints
        run: npm install --prefix "$RUNNER_TEMP/factory-artifact-client" --ignore-scripts --no-audit --no-fund @actions/artifact@2.3.2

      - name: Ejecutar la fábrica con recuperación
        uses: actions/github-script@v7
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Cuenta de la fábrica en Forja (sección [forja] de factory.toml).
          FORJA_EMAIL: ${{ secrets.FORJA_EMAIL }}
          FORJA_PASSWORD: ${{ secrets.FORJA_PASSWORD }}
          GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN || github.token }}
          # Se pasan por variable de entorno, no interpolados en el script, para evitar inyección.
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TASK_TEXT: ${{ github.event.inputs.task }}
          DISPATCH_ISSUE: ${{ github.event.inputs.issue }}
          EVENT_NAME: ${{ github.event_name }}
          RESUME_RUN_ID: ${{ github.event.inputs.resume_run_id }}
          CHECKPOINT_ARTIFACT: ${{ github.event.inputs.checkpoint_artifact }}
        with:
          script: |
            const {spawnSync} = require('node:child_process');
            const path = require('node:path');
            const locate = spawnSync('python', ['-c', 'import ai_factory, pathlib; print(pathlib.Path(ai_factory.__file__).parent / "upload-checkpoint.cjs")'], {encoding:'utf8'});
            if (locate.status !== 0) throw new Error('No se encontró AI Factory');
            const uploader = locate.stdout.trim();
            const env = {...process.env,
              FACTORY_CHECKPOINT_UPLOADER: `node "${uploader}"`,
              FACTORY_ARTIFACT_MODULE: path.join(process.env.RUNNER_TEMP, 'factory-artifact-client/node_modules/@actions/artifact')};
            const issue = env.ISSUE_NUMBER || env.DISPATCH_ISSUE;
            let args;
            if (env.RESUME_RUN_ID || env.CHECKPOINT_ARTIFACT) {
              if (!issue || !/^[0-9]+$/.test(env.CHECKPOINT_ARTIFACT || '') || !/^[\w-]+$/.test(env.RESUME_RUN_ID || '')) {
                throw new Error('La recuperación requiere issue, resume_run_id y checkpoint_artifact válidos');
              }
              args = ['resume', env.RESUME_RUN_ID, '--artifact-id', env.CHECKPOINT_ARTIFACT, '--github-issue', issue];
            } else if (issue) {
              args = ['run', '--github-issue', issue];
            } else if (env.EVENT_NAME === 'schedule') {
              args = ['intake', '--limit', '3'];
            } else {
              args = ['run', '--task', env.TASK_TEXT || ''];
            }
            // argv, never shell interpolation of issue/task inputs. Runtime artifact credentials
            // are available here and stripped from subprocesses used by agents/tests.
            const result = spawnSync('factory', args, {env, stdio:'inherit'});
            if (result.error) throw result.error;
            if (result.status !== 0) core.setFailed(`AI Factory terminó con código ${result.status}`);

      - name: Guardar auditoría
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-factory-${{ github.run_id }}
          path: .factory/runs/
          include-hidden-files: true
          if-no-files-found: ignore
