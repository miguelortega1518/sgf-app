# AI Factory: convierte issues etiquetados en cambios probados y revisados.
# https://github.com/miguelortega1518/ai-factory
#
# Requisitos (Settings → Secrets and variables → Actions):
#   - CLAUDE_CODE_OAUTH_TOKEN (obligatorio): token de tu suscripción de Claude. Genéralo en tu equipo
#     con `claude setup-token`. Las ejecuciones consumen la cuota de la suscripción, no API de pago.
#   - FACTORY_GH_TOKEN  (recomendado): token personal con permiso de escritura en Contents, Pull requests e Issues.
#     Sin él, los push y PR de la fábrica usan GITHUB_TOKEN y GitHub NO lanza el CI sobre ellos.
# Y en Settings → Actions → General: "Allow GitHub Actions to create and approve pull requests".
name: AI Factory

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      task:
        description: "Tarea en texto libre"
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write   # la fábrica comenta el resultado y cierra el issue

# Una ejecución por issue: varias tareas avanzan en paralelo sin cancelarse entre sí (con un grupo
# único, GitHub sólo deja una en espera y cancelaba las demás). Si dos fusionan a la vez, la fábrica
# incorpora la otra, vuelve a verificar y reintenta la fusión.
concurrency:
  group: ai-factory-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  factory:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'ai-factory'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    # Base de datos desechable para el tester funcional (misma versión que producción, como el CI).
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sgf
          POSTGRES_PASSWORD: sgf
          POSTGRES_DB: sgf_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sgf -d sgf_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.FACTORY_GH_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar AI Factory y Claude Code
        run: |
          pip install "ai-factory @ git+https://github.com/miguelortega1518/ai-factory@main"
          # Instalador nativo: trae siempre la última versión (los modelos nuevos exigen versiones recientes).
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/claude" --version

      - name: Instalar el navegador del tester funcional
        run: |
          npm install -g playwright@1.63.0
          npx -y playwright@1.63.0 install --with-deps chromium
          command -v psql || sudo apt-get install -y postgresql-client
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"

      - name: Configurar git
        run: |
          git config user.name "ai-factory[bot]"
          git config user.email "ai-factory@users.noreply.github.com"

      - name: Ejecutar la fábrica
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN || github.token }}
          # Se pasan por variable de entorno, no interpolados en el script, para evitar inyección.
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TASK_TEXT: ${{ github.event.inputs.task }}
        run: |
          if [ "${{ github.event_name }}" = "issues" ]; then
            factory run --github-issue "$ISSUE_NUMBER"
          else
            factory run --task "$TASK_TEXT"
          fi

      - name: Guardar auditoría
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-factory-${{ github.run_id }}
          path: .factory/runs/
          include-hidden-files: true
          if-no-files-found: ignore
