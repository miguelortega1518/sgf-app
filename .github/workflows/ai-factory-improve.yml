# AI Factory · mejora continua: revisa sgf-app cada semana y propone mejoras como issues.
# https://github.com/miguelortega1518/ai-factory
#
# Las propuestas llevan la etiqueta `ai-factory-propuesta`, que NO lanza la fábrica.
# Para que la fábrica implemente una, añádele la etiqueta `ai-factory`. Si no te interesa, ciérrala.
#
# Usa los mismos secretos que el workflow AI Factory: CLAUDE_CODE_OAUTH_TOKEN y FACTORY_GH_TOKEN.
name: AI Factory · mejora continua

on:
  schedule:
    - cron: "17 12 * * 1"   # lunes 12:17 UTC (08:17 en República Dominicana)
  workflow_dispatch:
    inputs:
      max:
        description: "Propuestas como máximo"
        required: false
        default: "3"

permissions:
  contents: read
  issues: write

# No coincide con una ejecución de la fábrica: así no compiten por la cuota.
concurrency:
  group: ai-factory
  cancel-in-progress: false

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar AI Factory y Claude Code
        run: |
          pip install "ai-factory @ git+https://github.com/miguelortega1518/ai-factory@main"
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/claude" --version

      - name: Proponer mejoras
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN || github.token }}
          # Por variable de entorno, no interpolado en el script.
          MAX_PROPOSALS: ${{ github.event.inputs.max || '3' }}
        run: factory improve --max "$MAX_PROPOSALS"
